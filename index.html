<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Gifts Challenge</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: #0a0a0f;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        padding: 20px;
    }
    .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
    }
    h1 {
        font-size: 1.5rem;
        letter-spacing: 3px;
        margin-bottom: 6px;
        color: #ddd;
    }
    .sub {
        color: #777;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }
    #progress {
        font-size: 1.3rem;
        margin-bottom: 25px;
        color: #aaa;
    }
    #progress span {
        color: #00f5d4;
        font-weight: 700;
        font-size: 1.6rem;
    }
    #encourage {
        min-height: 28px;
        margin-bottom: 20px;
        color: #00f5d4;
        font-size: 1.05rem;
        transition: all 0.3s;
    }
    #game-box {
        background: #12121a;
        border: 1px solid #222;
        border-radius: 16px;
        padding: 30px 20px;
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .gift {
        font-size: 60px;
        cursor: pointer;
        transition: transform 0.2s;
        user-select: none;
    }
    .gift:active { transform: scale(0.9); }
    .btn {
        background: #1a1a24;
        border: 1px solid #333;
        color: #eee;
        padding: 12px 32px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 15px;
        transition: 0.25s;
    }
    .btn:hover {
        border-color: #00f5d4;
        color: #00f5d4;
    }
    .question {
        font-size: 1.15rem;
        line-height: 1.5;
        margin-bottom: 20px;
        color: #ddd;
    }
    .options button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        background: #1a1a24;
        border: 1px solid #333;
        color: #eee;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.2s;
    }
    .options button:hover {
        border-color: #00f5d4;
        color: #00f5d4;
    }
    #final {
        display: none;
        opacity: 0;
        transition: opacity 1s;
    }
    #final.show {
        display: block;
        opacity: 1;
    }
    .final-text {
        font-size: 2.8rem;
        font-weight: 800;
        background: linear-gradient(90deg, #00f5d4, #7b2cbf, #00f5d4);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
        letter-spacing: 3px;
        margin: 20px 0;
    }
    @keyframes shine {
        to { background-position: 200% center; }
    }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
    <h1>20 GIFTS CHALLENGE</h1>
    <p class="sub">Mở hết 20 phần quà để đến đích</p>

    <div id="progress">Phần quà: <span id="count">0</span> / 20</div>
    <div id="encourage">Sẵn sàng chưa?</div>

    <div id="game-box">
        <div id="start-screen">
            <div style="font-size:50px; margin-bottom:15px">🎁</div>
            <p style="margin-bottom:20px; color:#aaa">Nhấn bắt đầu để mở phần quà đầu tiên</p>
            <button class="btn" onclick="nextStage()">BẮT ĐẦU</button>
        </div>

        <div id="gift-screen" class="hidden">
            <div class="gift" id="gift-btn" onclick="openGift()">🎁</div>
            <p style="margin-top:15px; color:#888">Nhấn để mở quà</p>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="question" id="question-text"></div>
            <div class="options" id="options"></div>
        </div>
    </div>

    <div id="final">
        <div style="font-size:40px; margin-bottom:10px">✅</div>
        <div class="final-text">MISSION COMPLETE</div>
        <p style="color:#888; letter-spacing:2px">Bạn đã mở hết 20 phần quà</p>
    </div>
</div>

<script>
    let current = 0;
    const total = 20;
    const encourageList = [
        "Tốt lắm!",
        "Cứ thế này tiếp tục!",
        "Bạn đang làm rất tốt!",
        "Còn một chặng đường nữa thôi!",
        "Đừng dừng lại nha!",
        "Tuyệt vời!",
        "Sắp đến nơi rồi!",
        "Cố lên, bạn làm được!",
        "Quá đỉnh!",
        "Giữ vững phong độ!",
        "Chỉ còn vài phần nữa!",
        "Bạn đang tiến rất gần!",
        "Không được bỏ cuộc!",
        "Gần về đích rồi!",
        "Xuất sắc!",
        "Còn chút nữa thôi!",
        "Sắp xong rồi!",
        "Vượt qua được đó!",
        "Phần cuối rồi nè!",
        "Chúc mừng, bạn đã hoàn thành!"
    ];

    // Một số câu đố đơn giản
    const quizzes = [
        {
            q: "Con gì kêu 'meo meo'?",
            options: ["Chó", "Mèo", "Gà", "Vịt"],
            answer: 1
        },
        {
            q: "1 + 1 bằng mấy?",
            options: ["1", "2", "3", "11"],
            answer: 1
        },
        {
            q: "Màu của bầu trời ban ngày thường là?",
            options: ["Đỏ", "Xanh", "Vàng", "Đen"],
            answer: 1
        },
        {
            q: "Con vật nào bay được?",
            options: ["Cá", "Chim", "Rùa", "Heo"],
            answer: 1
        },
        {
            q: "Số nào lớn nhất?",
            options: ["5", "9", "3", "7"],
            answer: 1
        },
        {
            q: "Ngày có bao nhiêu giờ?",
            options: ["12", "24", "48", "60"],
            answer: 1
        }
    ];

    function updateProgress() {
        document.getElementById('count').textContent = current;
        if (current > 0 && current <= 20) {
            document.getElementById('encourage').textContent = encourageList[current - 1];
        }
    }

    function nextStage() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('gift-screen').classList.add('hidden');

        if (current >= total) {
            showFinal();
            return;
        }

        // Xen kẽ: cứ 3 phần quà thì có 1 câu đố
        if (current > 0 && current % 3 === 0 && quizzes.length > 0) {
            showQuiz();
        } else {
            showGift();
        }
    }

    function showGift() {
        document.getElementById('gift-screen').classList.remove('hidden');
    }

    function openGift() {
        current++;
        updateProgress();
        
        // Hiệu ứng đơn giản
        const gift = document.getElementById('gift-btn');
        gift.style.transform = 'scale(1.3)';
        setTimeout(() => {
            gift.style.transform = 'scale(1)';
            nextStage();
        }, 300);
    }

    function showQuiz() {
        const quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
        document.getElementById('question-text').textContent = quiz.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        quiz.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => {
                if (index === quiz.answer) {
                    current++;
                    updateProgress();
                    nextStage();
                } else {
                    document.getElementById('encourage').textContent = "Sai rồi, thử lại nào!";
                    document.getElementById('encourage').style.color = "#ff6b6b";
                    setTimeout(() => {
                        document.getElementById('encourage').style.color = "#00f5d4";
                        document.getElementById('encourage').textContent = encourageList[Math.max(0, current - 1)];
                    }, 1200);
                }
            };
            optionsDiv.appendChild(btn);
        });

        document.getElementById('quiz-screen').classList.remove('hidden');
    }

    function showFinal() {
        document.getElementById('game-box').style.display = 'none';
        document.getElementById('progress').style.display = 'none';
        document.getElementById('encourage').style.display = 'none';
        document.getElementById('final').classList.add('show');
    }
</script>
</body>
</html>
