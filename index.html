<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frustration Game</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: #0a0a0f;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
    }
    .container {
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 20px;
    }
    h1 {
        font-size: 1.4rem;
        letter-spacing: 3px;
        margin-bottom: 8px;
        color: #ccc;
    }
    .sub {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }
    #stage-info {
        font-size: 1.1rem;
        color: #aaa;
        margin-bottom: 25px;
    }
    #stage-info span {
        color: #ff4d6d;
        font-weight: 700;
    }
    #game-area {
        background: #12121a;
        border: 1px solid #222;
        border-radius: 16px;
        height: 360px;
        position: relative;
        overflow: hidden;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .btn {
        background: #1c1c26;
        border: 1px solid #333;
        color: #eee;
        padding: 12px 28px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn:hover {
        border-color: #ff4d6d;
        color: #ff4d6d;
    }
    /* Stage 1 - Button chạy */
    #run-btn {
        position: absolute;
        padding: 14px 26px;
        background: #ff4d6d;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.15s;
        z-index: 10;
    }
    /* Stage 2 - Progress troll */
    #progress-box {
        width: 80%;
        text-align: center;
    }
    #bar-bg {
        width: 100%;
        height: 28px;
        background: #222;
        border-radius: 20px;
        overflow: hidden;
        margin: 20px 0;
    }
    #bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff4d6d, #ff8fa3);
        transition: width 0.3s;
    }
    /* Stage 3 - Tiny button */
    #tiny-btn {
        position: absolute;
        width: 18px;
        height: 18px;
        background: #ff4d6d;
        border-radius: 50%;
        cursor: pointer;
        border: none;
    }
    #final {
        display: none;
        opacity: 0;
        transition: opacity 1s;
    }
    #final.show {
        display: block;
        opacity: 1;
    }
    .gay-text {
        font-size: 3.2rem;
        font-weight: 900;
        color: #ff4d6d;
        letter-spacing: 4px;
        margin: 20px 0;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
    <h1>FRUSTRATION PROTOCOL</h1>
    <p class="sub">Hoàn thành 3 ván ức chế để mở kết quả</p>

    <div id="stage-info">Ván: <span id="stage-num">1</span> / 3</div>

    <div id="game-area">
        <!-- Start -->
        <div id="start-screen">
            <p style="color:#888; margin-bottom:20px">Sẵn sàng bị ức chế chưa?</p>
            <button class="btn" onclick="startStage1()">BẮT ĐẦU VÁN 1</button>
        </div>

        <!-- Stage 1 -->
        <button id="run-btn" class="hidden" onclick="completeStage1()">Bấm vào đây</button>

        <!-- Stage 2 -->
        <div id="stage2" class="hidden">
            <div id="progress-box">
                <p style="margin-bottom:10px; color:#ccc">Giữ nút để đầy thanh</p>
                <div id="bar-bg"><div id="bar"></div></div>
                <button class="btn" id="hold-btn">GIỮ TÔI</button>
                <p id="stage2-msg" style="margin-top:15px; color:#888; font-size:0.9rem"></p>
            </div>
        </div>

        <!-- Stage 3 -->
        <button id="tiny-btn" class="hidden"></button>
        <p id="stage3-text" class="hidden" style="color:#888; position:absolute; top:20px; width:100%; text-align:center">
            Tìm và bấm vào chấm đỏ siêu nhỏ
        </p>
    </div>

    <div id="final">
        <div class="gay-text">YOU ARE GAY !</div>
        <p style="color:#666; letter-spacing:2px">Mission Complete</p>
    </div>
</div>

<script>
    let stage = 1;

    // ========== STAGE 1: Nút chạy lung tung ==========
    function startStage1() {
        document.getElementById('start-screen').classList.add('hidden');
        const btn = document.getElementById('run-btn');
        btn.classList.remove('hidden');
        document.getElementById('stage-num').textContent = 1;

        // Nút chạy khi chuột lại gần
        const area = document.getElementById('game-area');
        area.addEventListener('mousemove', function(e) {
            if (stage !== 1) return;
            const rect = area.getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();
            
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const btnX = btnRect.left - rect.left + btnRect.width/2;
            const btnY = btnRect.top - rect.top + btnRect.height/2;

            const dist = Math.hypot(mouseX - btnX, mouseY - btnY);

            if (dist < 120) {
                // Chạy xa
                const newX = Math.random() * (area.clientWidth - 140);
                const newY = Math.random() * (area.clientHeight - 50);
                btn.style.left = newX + 'px';
                btn.style.top = newY + 'px';
            }
        });

        // Đặt vị trí ban đầu
        btn.style.left = '50%';
        btn.style.top = '50%';
        btn.style.transform = 'translate(-50%, -50%)';
    }

    function completeStage1() {
        stage = 2;
        document.getElementById('run-btn').classList.add('hidden');
        document.getElementById('stage-num').textContent = 2;
        startStage2();
    }

    // ========== STAGE 2: Thanh tiến độ troll ==========
    let progress = 0;
    let holding = false;
    let holdInterval;

    function startStage2() {
        document.getElementById('stage2').classList.remove('hidden');
        const holdBtn = document.getElementById('hold-btn');
        const bar = document.getElementById('bar');
        const msg = document.getElementById('stage2-msg');

        holdBtn.addEventListener('mousedown', () => {
            holding = true;
            msg.textContent = "Đang giữ...";
            holdInterval = setInterval(() => {
                if (holding) {
                    progress += 1.2;
                    if (progress > 100) progress = 100;
                    bar.style.width = progress + '%';

                    // Troll: thỉnh thoảng tụt
                    if (Math.random() < 0.08 && progress > 20) {
                        progress -= 18;
                        if (progress < 0) progress = 0;
                        bar.style.width = progress + '%';
                        msg.textContent = "Úi bị tụt rồi 😈";
                    }

                    if (progress >= 100) {
                        clearInterval(holdInterval);
                        completeStage2();
                    }
                }
            }, 50);
        });

        holdBtn.addEventListener('mouseup', () => {
            holding = false;
            clearInterval(holdInterval);
            msg.textContent = "Thả ra là mất tiến độ nha";
            // Tụt khi thả
            progress = Math.max(0, progress - 25);
            bar.style.width = progress + '%';
        });

        holdBtn.addEventListener('mouseleave', () => {
            if (holding) {
                holding = false;
                clearInterval(holdInterval);
                progress = Math.max(0, progress - 30);
                bar.style.width = progress + '%';
                msg.textContent = "Rời chuột = tụt mạnh";
            }
        });
    }

    function completeStage2() {
        stage = 3;
        document.getElementById('stage2').classList.add('hidden');
        document.getElementById('stage-num').textContent = 3;
        startStage3();
    }

    // ========== STAGE 3: Nút siêu nhỏ chạy ==========
    function startStage3() {
        const tiny = document.getElementById('tiny-btn');
        const text = document.getElementById('stage3-text');
        tiny.classList.remove('hidden');
        text.classList.remove('hidden');

        const area = document.getElementById('game-area');

        function moveTiny() {
            const x = Math.random() * (area.clientWidth - 20);
            const y = Math.random() * (area.clientHeight - 20);
            tiny.style.left = x + 'px';
            tiny.style.top = y + 'px';
        }

        moveTiny();
        const moveInterval = setInterval(moveTiny, 700);

        tiny.onclick = () => {
            clearInterval(moveInterval);
            tiny.classList.add('hidden');
            text.classList.add('hidden');
            showFinal();
        };
    }

    function showFinal() {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('stage-info').style.display = 'none';
        document.querySelector('.sub').style.display = 'none';
        document.querySelector('h1').style.display = 'none';
        
        const final = document.getElementById('final');
        final.classList.add('show');
    }
</script>
</body>
</html>
