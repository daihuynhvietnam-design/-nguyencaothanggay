<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất Ngờ Dành Cho Em 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a12, #2d0a1e, #1a0a12);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Trái tim bay */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: #ff4d6d;
            opacity: 0.6;
            animation: float 8s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ffb3c1;
            letter-spacing: 2px;
        }

        /* Trái tim lớn */
        .heart-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 40px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .heart-wrapper:hover {
            transform: scale(1.08);
        }

        .heart {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff2e63, #ff6b9d);
            clip-path: path('M110 190 C 20 100, 20 40, 70 40 C 95 40, 110 65, 110 65 C 110 65, 125 40, 150 40 C 200 40, 200 100, 110 190 Z');
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255, 46, 99, 0.6);
            animation: heartbeat 1.4s ease-in-out infinite;
            position: relative;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.12); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
        }

        .heart-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        /* Ô nhập mật khẩu */
        #password-section {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #password-input {
            padding: 16px 28px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            width: 280px;
            max-width: 90%;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid #ff6b9d;
            outline: none;
            margin-bottom: 18px;
        }

        #password-input:focus {
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.5);
        }

        #submit-btn {
            background: linear-gradient(45deg, #ff2e63, #ff6b9d);
            border: none;
            padding: 14px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 46, 99, 0.4);
            transition: all 0.3s;
        }

        #submit-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px rgba(255, 46, 99, 0.6);
        }

        #error-msg {
            margin-top: 15px;
            color: #ff8fa3;
            font-size: 1rem;
            min-height: 24px;
        }

        /* Phần I LOVE YOU */
        #result {
            display: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #result.show {
            display: block;
            opacity: 1;
        }

        .love-text {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ff2e63, #ff85a2, #ff2e63);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite, pulse 2s ease-in-out infinite;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(255, 46, 99, 0.5);
            margin-bottom: 20px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sub-text {
            font-size: 1.3rem;
            color: #ffb3c1;
            margin-top: 15px;
        }

        /* Confetti trái tim */
        .heart-confetti {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            z-index: 100;
            animation: fall 4s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dành riêng cho em 💕</h1>

        <!-- Trái tim -->
        <div class="heart-wrapper" id="heartBtn" onclick="showPassword()">
            <div class="heart">
                <div class="heart-text">Nhấn vào đây</div>
            </div>
        </div>

        <!-- Nhập mật khẩu -->
        <div id="password-section">
            <input type="text" id="password-input" placeholder="Nhập mật khẩu..." autocomplete="off">
            <br>
            <button id="submit-btn" onclick="checkPassword()">Mở bất ngờ</button>
            <p id="error-msg"></p>
        </div>

        <!-- Kết quả -->
        <div id="result">
            <div class="love-text">I LOVE YOU</div>
            <p class="sub-text">💕</p>
        </div>
    </div>

    <script>
        // Tạo trái tim bay
        function createFloatingHearts() {
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
                heart.style.animationDelay = Math.random() * 8 + 's';
                heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
                document.body.appendChild(heart);
            }
        }
        createFloatingHearts();

        function showPassword() {
            document.getElementById('heartBtn').style.display = 'none';
            document.getElementById('password-section').style.display = 'block';
            document.getElementById('password-input').focus();
        }

        function checkPassword() {
            const input = document.getElementById('password-input').value.trim().toLowerCase();
            const error = document.getElementById('error-msg');

            if (input === "chuccauthang9") {
                error.textContent = "";
                document.getElementById('password-section').style.display = 'none';
                
                const result = document.getElementById('result');
                result.classList.add('show');
                
                // Pháo hoa trái tim
                createHeartConfetti();
                
                // Tự động tạo thêm confetti
                setTimeout(createHeartConfetti, 800);
                setTimeout(createHeartConfetti, 1600);
            } else {
                error.textContent = "Sai mật khẩu rồi 😢 Thử lại nhé";
            }
        }

        // Cho phép nhấn Enter
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        function createHeartConfetti() {
            const hearts = ['❤️', '💕', '💗', '💖', '💘', '💝'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'heart-confetti';
                confetti.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.fontSize = (Math.random() * 18 + 16) + 'px';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>
