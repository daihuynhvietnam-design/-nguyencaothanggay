<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock The Secret</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #e0e0e0;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 40px;
        }

        /* SCORE */
        #score-board {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: #aaa;
        }

        #score {
            color: #00f5d4;
            font-weight: 700;
            font-size: 1.8rem;
        }

        /* GAME AREA */
        #game-area {
            position: relative;
            width: 100%;
            height: 320px;
            background: #121218;
            border: 1px solid #222;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        #target {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff2e63, #ff6b9d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 46, 99, 0.5);
            transition: transform 0.1s;
            user-select: none;
        }

        #target:active {
            transform: scale(0.9);
        }

        .btn {
            background: #1a1a22;
            border: 1px solid #333;
            color: white;
            padding: 14px 36px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #222;
            border-color: #00f5d4;
            color: #00f5d4;
        }

        #start-btn {
            margin-top: 10px;
        }

        /* RESULT */
        #result {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #result.show {
            display: block;
            opacity: 1;
        }

        .love-text {
            font-size: 3.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00f5d4, #7b2cbf, #00f5d4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .result-sub {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00f5d4;
            border-radius: 50%;
            pointer-events: none;
            animation: particle 0.6s ease-out forwards;
        }

        @keyframes particle {
            to {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ACCESS REQUIRED</h1>
        <p class="subtitle">Reach 100 points to unlock</p>

        <div id="score-board">
            SCORE: <span id="score">0</span> / 100
        </div>

        <div id="game-area">
            <div id="target">❤️</div>
        </div>

        <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>

        <!-- Kết quả -->
        <div id="result">
            <div class="love-text">I LOVE YOU</div>
            <p class="result-sub">MISSION COMPLETE</p>
        </div>
    </div>

    <script>
        let score = 0;
        let gameRunning = false;
        let target = document.getElementById('target');
        let scoreDisplay = document.getElementById('score');
        let gameArea = document.getElementById('game-area');
        let startBtn = document.getElementById('start-btn');

        function startGame() {
            if (gameRunning) return;
            
            score = 0;
            scoreDisplay.textContent = score;
            gameRunning = true;
            startBtn.style.display = 'none';
            document.getElementById('result').classList.remove('show');
            
            moveTarget();
        }

        function moveTarget() {
            if (!gameRunning) return;

            const areaWidth = gameArea.clientWidth - 70;
            const areaHeight = gameArea.clientHeight - 70;

            const x = Math.random() * areaWidth;
            const y = Math.random() * areaHeight;

            target.style.left = x + 'px';
            target.style.top = y + 'px';

            // Tự động di chuyển sau 1.1 giây nếu không click
            setTimeout(() => {
                if (gameRunning) moveTarget();
            }, 1100);
        }

        target.addEventListener('click', function(e) {
            if (!gameRunning) return;

            score += 10;
            scoreDisplay.textContent = score;

            // Hiệu ứng hạt
            createParticles(e.clientX, e.clientY);

            // Scale nhỏ khi click
            target.style.transform = 'scale(0.85)';
            setTimeout(() => target.style.transform = 'scale(1)', 80);

            if (score >= 100) {
                gameRunning = false;
                unlock();
            } else {
                moveTarget();
            }
        });

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 40;
                p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        function unlock() {
            target.style.display = 'none';
            gameArea.style.display = 'none';
            document.getElementById('score-board').style.display = 'none';
            
            const result = document.getElementById('result');
            result.classList.add('show');
        }
    </script>
</body>
</html>
