<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Câu Hỏi</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: #0b0b10;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .container {
        max-width: 460px;
        width: 100%;
        text-align: center;
    }
    h1 {
        font-size: 1.5rem;
        letter-spacing: 2px;
        margin-bottom: 8px;
        color: #ddd;
    }
    .sub {
        color: #777;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }
    #progress {
        font-size: 1.1rem;
        color: #aaa;
        margin-bottom: 25px;
    }
    #progress span {
        color: #00f5d4;
        font-weight: 700;
    }
    #box {
        background: #13131a;
        border: 1px solid #222;
        border-radius: 16px;
        padding: 30px 22px;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .question {
        font-size: 1.25rem;
        line-height: 1.5;
        margin-bottom: 28px;
        color: #e0e0e0;
    }
    .options button {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 14px;
        background: #1c1c26;
        border: 1px solid #333;
        color: #eee;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }
    .options button:hover {
        border-color: #00f5d4;
        color: #00f5d4;
        background: #1f1f2a;
    }
    .btn {
        background: #1c1c26;
        border: 1px solid #333;
        color: #eee;
        padding: 13px 36px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.25s;
    }
    .btn:hover {
        border-color: #00f5d4;
        color: #00f5d4;
    }
    #final-box, #result-box {
        display: none;
    }
    .big-question {
        font-size: 1.5rem;
        margin-bottom: 30px;
        color: #fff;
        font-weight: 600;
    }
    .result-text {
        font-size: 1.6rem;
        margin: 20px 0;
        color: #00f5d4;
        font-weight: 600;
    }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
    <h1>20 CÂU HỎI</h1>
    <p class="sub">Trả lời hết mới được hỏi câu quan trọng</p>

    <div id="progress">Câu hỏi: <span id="num">0</span> / 20</div>

    <div id="box">
        <!-- Màn hình bắt đầu -->
        <div id="start-screen">
            <div style="font-size: 42px; margin-bottom: 16px">❓</div>
            <p style="color:#999; margin-bottom: 24px">Sẵn sàng trả lời 20 câu chưa?</p>
            <button class="btn" onclick="startQuiz()">BẮT ĐẦU</button>
        </div>

        <!-- Câu hỏi thường -->
        <div id="quiz-screen" class="hidden">
            <div class="question" id="q-text"></div>
            <div class="options" id="options"></div>
        </div>

        <!-- Câu cuối -->
        <div id="final-box" class="hidden">
            <div class="big-question">Bạn có thích tôi không?</div>
            <div class="options">
                <button onclick="showResult(true)">Có</button>
                <button onclick="showResult(false)">Không</button>
                <button onclick="showResult('maybe')">Hơi hơi</button>
            </div>
        </div>

        <!-- Kết quả -->
        <div id="result-box" class="hidden">
            <div id="result-text" class="result-text"></div>
            <p style="color:#777; margin-top:10px" id="result-sub"></p>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Trong thời gian qua, bạn thấy tôi như thế nào?",
            options: ["Bình thường", "Cũng ổn", "Khá thú vị", "Khó hiểu"]
        },
        {
            q: "Bạn có hay nghĩ về tôi không?",
            options: ["Không bao giờ", "Thỉnh thoảng", "Khá thường xuyên", "Hơi nhiều"]
        },
        {
            q: "Khi nhắn tin với tôi, bạn cảm thấy sao?",
            options: ["Bình thường", "Thoải mái", "Hơi vui", "Thích"]
        },
        {
            q: "Bạn có muốn tìm hiểu tôi nhiều hơn không?",
            options: ["Không", "Cũng được", "Có", "Rất muốn"]
        },
        {
            q: "Nếu chúng ta gặp nhau ngoài đời, bạn sẽ?",
            options: ["Ngại", "Bình thường", "Hào hứng", "Khá mong chờ"]
        },
        {
            q: "Bạn đánh giá độ thú vị của tôi?",
            options: ["1/10", "5/10", "7/10", "9/10"]
        },
        {
            q: "Bạn có thấy tôi dễ thương không?",
            options: ["Không", "Bình thường", "Có một chút", "Có"]
        },
        {
            q: "Khi tôi nhắn trước, bạn cảm thấy?",
            options: ["Phiền", "Bình thường", "Vui", "Khá thích"]
        },
        {
            q: "Bạn có muốn tôi quan tâm bạn nhiều hơn không?",
            options: ["Không cần", "Cũng được", "Được chứ", "Muốn"]
        },
        {
            q: "Nếu tôi mời bạn đi chơi, bạn sẽ?",
            options: ["Từ chối", "Suy nghĩ", "Đồng ý", "Rất muốn đi"]
        },
        {
            q: "Bạn có để ý đến tôi không?",
            options: ["Không", "Hơi hơi", "Có", "Khá để ý"]
        },
        {
            q: "Bạn thấy tính cách tôi thế nào?",
            options: ["Khó chịu", "Bình thường", "Dễ chịu", "Hợp"]
        },
        {
            q: "Bạn có muốn trò chuyện với tôi lâu hơn không?",
            options: ["Không", "Cũng được", "Có", "Muốn"]
        },
        {
            q: "Khi thấy tin nhắn của tôi, bạn?",
            options: ["Lười trả lời", "Trả lời bình thường", "Trả lời khá nhanh", "Hơi mong"]
        },
        {
            q: "Bạn có nghĩ chúng ta hợp nhau không?",
            options: ["Không", "Chưa biết", "Có thể", "Khá hợp"]
        },
        {
            q: "Bạn có muốn tôi trở thành người đặc biệt không?",
            options: ["Không", "Chưa chắc", "Có thể", "Muốn thử"]
        },
        {
            q: "Mức độ thiện cảm của bạn với tôi hiện tại?",
            options: ["Thấp", "Trung bình", "Khá cao", "Cao"]
        },
        {
            q: "Bạn có hay cười khi nói chuyện với tôi không?",
            options: ["Không", "Hiếm khi", "Thỉnh thoảng", "Khá thường"]
        },
        {
            q: "Nếu tôi biến mất, bạn sẽ?",
            options: ["Không quan tâm", "Hơi lạ", "Thấy thiếu", "Buồn"]
        },
        {
            q: "Bạn có muốn tiếp tục tìm hiểu tôi không?",
            options: ["Không", "Tạm thời", "Có", "Rất muốn"]
        }
    ];

    let current = 0;

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if (current >= 20) {
            // Hiện câu cuối
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('final-box').classList.remove('hidden');
            document.getElementById('progress').style.display = 'none';
            return;
        }

        document.getElementById('num').textContent = current + 1;
        const q = questions[current];
        document.getElementById('q-text').textContent = q.q;

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        q.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => {
                current++;
                showQuestion();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function showResult(answer) {
        document.getElementById('final-box').classList.add('hidden');
        document.getElementById('result-box').classList.remove('hidden');

        const resultText = document.getElementById('result-text');
        const resultSub = document.getElementById('result-sub');

        if (answer === true) {
            resultText.textContent = "Cảm ơn bạn ❤️";
            resultSub.textContent = "Mình cũng vậy.";
        } else if (answer === false) {
            resultText.textContent = "Không sao đâu";
            resultSub.textContent = "Cảm ơn bạn đã trả lời thật lòng.";
        } else {
            resultText.textContent = "Hơi hơi cũng được";
            resultSub.textContent = "Từ từ rồi tính tiếp nha.";
        }
    }
</script>
</body>
</html>
